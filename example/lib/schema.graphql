"""
What the catalogue can be asked.

Every public method becomes a field of `Query`: the parameters become the
arguments, the return type becomes the type of the field. Nothing here
mentions GraphQL.
"""
type Query {
  """Reads one product, or null when the catalogue does not hold it."""
  product(sku: String!): Product

  """The number of products the catalogue holds."""
  productCount: Int!

  """Lists the products matching [filter], newest first."""
  products(filter: ProductFilterInput!, limit: Int): [Product!]!
}

"""What the catalogue can be told."""
type Mutation {
  """Removes a product from the catalogue."""
  deleteProduct(sku: String!): Boolean! @deprecated(reason: "Set availability to outOfStock instead.")

  """Files an existing product under one more tag."""
  tagProduct(sku: String!, tag: TagInput!): Product!

  """Creates a product, or replaces the one already carrying that SKU."""
  upsertProduct(draft: ProductDraftInput!): Product!
}

"""Whether a product can be ordered right now."""
enum Availability {
  """On the shelf, ready to ship."""
  inStock

  """Known to the catalogue, not orderable today."""
  outOfStock

  """Kept for the orders placed before the catalogue was cleaned up."""
  unknown @deprecated(reason: "Split into inStock and outOfStock.")
}

scalar DateTime

"""A product on sale."""
type Product {
  """The stock keeping unit. Unique across the catalogue."""
  sku: String!

  """The name shown to a customer."""
  label: String!

  """The price in cents, to keep the wire format free of floating point."""
  price_cents: Int!

  """Whether the product can be ordered right now."""
  availability: Availability!

  """The labels the product is filed under."""
  tags: [Tag!]!

  """When the product first went on sale, or null while it is a draft."""
  releasedAt: DateTime

  """The old free-form category, kept until the last importer is migrated."""
  category: String @deprecated(reason: "Use tags instead.")
}

"""The full state of a product, as the caller wants it stored."""
input ProductDraftInput {
  """The stock keeping unit the product is stored under."""
  sku: String!

  """The name shown to a customer."""
  label: String!

  """The price in cents."""
  priceCents: Int!

  """Whether the product can be ordered once stored."""
  availability: Availability! = inStock

  """The labels to file the product under."""
  tags: [TagInput!]! = []
}

"""
Narrows a product listing.

Only ever passed to a method, so the generator emits it as an input type
and never as an object type.
"""
input ProductFilterInput {
  """Keeps the products whose label contains this text."""
  labelContains: String

  """Keeps the products in this state."""
  availability: Availability

  """Keeps the products filed under every one of these tags."""
  tagSlugs: [String!]! = []
}

"""
A label a product can be filed under.

Read back inside a product and written inside a draft, so the generator
emits it twice: once as a type and once as an input.
"""
type Tag {
  """The machine-readable name, unique across the catalogue."""
  slug: String!

  """The name shown to a customer."""
  display_label: String!
}

"""
A label a product can be filed under.

Read back inside a product and written inside a draft, so the generator
emits it twice: once as a type and once as an input.
"""
input TagInput {
  """The machine-readable name, unique across the catalogue."""
  slug: String!

  """The name shown to a customer."""
  display_label: String!
}
