"""Reads of this type are written to the audit log."""
directive @audited on OBJECT

"""The value holds between [min] and [max] characters."""
directive @length(
  """The shortest value the field accepts."""
  min: Int! = 1

  """The longest value the field accepts."""
  max: Int!
) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION

"""Only the listed roles read the field."""
directive @restrictedTo(
  """The roles allowed to read the field."""
  roles: [Role!]!
) on FIELD_DEFINITION

"""What the catalogue can be asked."""
type Query {
  """Reads one product, or null when the catalogue does not hold it."""
  product(sku: ID!): Product

  """The number of products the catalogue holds."""
  productCount: Int!

  """Lists the products matching [filter], newest first."""
  products(filter: ProductFilterInput!, limit: Int): [Product!]!

  """Searches the whole catalogue, best match first."""
  search(text: String! @length(min: 2, max: 80)): [SearchHit!]!
}

"""What the catalogue can be told."""
type Mutation {
  """Removes a product from the catalogue."""
  deleteProduct(sku: ID!): Boolean! @deprecated(reason: "Set availability to outOfStock instead.") @restrictedTo(roles: [staff])

  """Files an existing product under one more tag."""
  tagProduct(sku: ID!, tag: TagInput!): Product!

  """Creates a product, or replaces the one already carrying that SKU."""
  upsertProduct(draft: ProductDraftInput!): Product!
}

"""What the catalogue reports as it happens."""
type Subscription {
  """Emits the product every time that SKU is stored or replaced."""
  productChanged(sku: ID!): Product!

  """Emits the number of products whenever the catalogue grows or shrinks."""
  productCountChanged: Int!
}

"""Whether a product can be ordered right now."""
enum Availability {
  """On the shelf, ready to ship."""
  inStock

  """Known to the catalogue, not orderable today."""
  outOfStock

  """Kept for the orders placed before the catalogue was cleaned up."""
  unknown @deprecated(reason: "Split into inStock and outOfStock.")
}

scalar DateTime

"""Anything the catalogue can show on a page."""
interface Listable {
  """The name shown to a customer."""
  label: String!
}

"""A product on sale."""
type Product implements Listable @audited {
  """The stock keeping unit. Unique across the catalogue."""
  sku: ID!

  """The name shown to a customer."""
  label: String!

  """The price in cents, to keep the wire format free of floating point."""
  priceCents: Int!

  """Whether the product can be ordered right now."""
  availability: Availability!

  """The labels the product is filed under."""
  tags: [Tag!]!

  """When the product first went on sale, or null while it is a draft."""
  releasedAt: DateTime

  """The old free-form category, kept until the last importer is migrated."""
  category: String @deprecated(reason: "Use tags instead.")

  """The price in whole euros, rounded down."""
  priceEuros: Int!
}

"""The full state of a product, as the caller wants it stored."""
input ProductDraftInput {
  """The stock keeping unit the product is stored under."""
  sku: ID!

  """The name shown to a customer."""
  label: String! @length(min: 1, max: 120)

  """The price in cents."""
  priceCents: Int!

  """Whether the product can be ordered once stored."""
  availability: Availability! = inStock

  """The labels to file the product under."""
  tags: [TagInput!]! = []
}

"""Narrows a product listing."""
input ProductFilterInput {
  """Keeps the products whose label contains this text."""
  labelContains: String

  """Keeps the products in this state."""
  availability: Availability

  """Keeps the products filed under every one of these tags."""
  tagSlugs: [String!]! = []
}

"""A product the search turned up."""
type ProductHit {
  """The product itself."""
  product: Product!

  """How well the hit matches what was searched for, from 0 to 1."""
  score: Float!
}

"""Who is asking the catalogue."""
enum Role {
  """Anyone browsing the shop."""
  customer

  """Someone working for the shop."""
  staff
}

"""Anything a search can turn up."""
union SearchHit = ProductHit | TagHit

"""A label a product can be filed under."""
type Tag implements Listable {
  """The machine-readable name, unique across the catalogue."""
  slug: String!

  """The name shown to a customer."""
  label: String!
}

"""A tag the search turned up."""
type TagHit {
  """The tag itself."""
  tag: Tag!

  """How many products carry it."""
  productCount: Int!

  """How well the hit matches what was searched for, from 0 to 1."""
  score: Float!
}

"""A label a product can be filed under."""
input TagInput {
  """The machine-readable name, unique across the catalogue."""
  slug: String!

  """The name shown to a customer."""
  label: String!
}
