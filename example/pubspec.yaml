name: acme_catalogue
description: A worked example of graphql_schema_generator, over plain Dart models.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

# The annotations are imported by the models, so they are an ordinary
# dependency. The models need none of them to reach the schema; they say the
# few things Dart cannot say on its own.
dependencies:
  graphql_schema_annotation: ^0.1.0

# The generator is a command that reads sources, so it never ships with them.
dev_dependencies:
  graphql_schema_generator:
    path: ../
  lint: ^2.10.0

# Read by graphql_schema_generator. Every entry is optional; these say how this
# package departs from the tool's defaults.
graphql_schema_generator:
  output: lib/schema.graphql
  roots:
    query: lib/api/queries.dart#Queries
    mutation: lib/api/mutations.dart#Mutations
    subscription: lib/api/subscriptions.dart#Subscriptions
  # For types that cannot be annotated. `Sku` belongs to this package and
  # carries `@GraphQLScalar('ID')` instead.
  scalars:
    DateTime: DateTime
