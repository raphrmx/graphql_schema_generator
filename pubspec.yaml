name: graphql_schema_generator
description: >-
  Generates a GraphQL SDL schema from plain Dart classes and enums. Reads the
  code, not a running server: no endpoint, no introspection query, and no
  credentials to hold.
version: 0.1.2
homepage: https://packages.comapps.be/#graphql_schema_generator
repository: https://github.com/raphrmx/graphql_schema_generator
issue_tracker: https://github.com/raphrmx/graphql_schema_generator/issues
funding:
  - https://www.paypal.com/donate/?hosted_button_id=ZN6D382YQAV5N
topics:
  - graphql
  - sdl
  - schema
  - codegen
  - server

environment:
  sdk: ^3.9.0

dependencies:
  analyzer: ">=12.0.0 <15.0.0"
  collection: ^1.19.1
  glob: ^2.2.0
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  lint: ^2.10.0
  test: ^1.31.0
